<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">ÔNG CHÚ MMO</title>
  <desc id="description">Biểu tượng neon ÔNG CHÚ MMO Live</desc>
  <defs>
    <linearGradient id="background" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17132f"/>
      <stop offset="1" stop-color="#080711"/>
    </linearGradient>
    <linearGradient id="neon" x1="96" y1="96" x2="420" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35f4ff"/>
      <stop offset="0.5" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#ff3ca6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#background)"/>
  <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="url(#neon)" stroke-width="12"/>
  <g fill="url(#neon)" filter="url(#glow)">
    <rect x="92" y="260" width="24" height="82" rx="12"/>
    <rect x="132" y="220" width="24" height="122" rx="12"/>
    <rect x="172" y="242" width="24" height="100" rx="12"/>
    <rect x="316" y="242" width="24" height="100" rx="12"/>
    <rect x="356" y="220" width="24" height="122" rx="12"/>
    <rect x="396" y="260" width="24" height="82" rx="12"/>
  </g>
  <circle cx="256" cy="236" r="104" fill="#0d0b1d" stroke="url(#neon)" stroke-width="10"/>
  <text x="256" y="275" fill="#ffffff" font-family="Arial, sans-serif" font-size="116" font-weight="800" text-anchor="middle">ÔC</text>
  <rect x="156" y="358" width="200" height="58" rx="29" fill="url(#neon)"/>
  <text x="256" y="399" fill="#090713" font-family="Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="8" text-anchor="middle">MMO</text>
</svg>
